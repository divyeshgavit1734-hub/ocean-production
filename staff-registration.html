<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ocean Production | Staff Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .header {
            background: #0b1220;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

    </style>

</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://nepianzfbysukaoqqbxf.supabase.co";
const SUPABASE_KEY = "sb_publishable_vA6sXJTvJO5QWY6BPyH79g_muuyN9_8";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function checkAdmin() {

    const {
        data: { session }
    } = await db.auth.getSession();

    if (!session) {
        window.location.replace("admin.html");
        return;
    }

    const role = session.user.app_metadata?.role;

    if (role !== "admin") {
        alert("Access denied. Admin only.");
        await db.auth.signOut();
        window.location.replace("staff.html");
        return;
    }
}

checkAdmin();
</script>


<body>


<header class="header">

    <h1>🌊 OCEAN PRODUCTION</h1>

    <p>Staff Registration</p>

</header>


<main class="container">

    <div class="card">

        <h2>👤 Register New Staff</h2>


        <form id="staffForm">


            <div class="field">

                <label>Full Name *</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter staff full name"
                    required
                >

            </div>


            <div class="field">

                <label>Mobile Number *</label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="10 digit mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

            </div>


            <div class="field">

                <label>WhatsApp Number</label>

                <input
                    type="tel"
                    id="whatsapp"
                    placeholder="WhatsApp number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                >

            </div>


            <div class="field">

                <label>Email *</label>

                <input
                    type="email"
                    id="email"
                    placeholder="staff@email.com"
                    required
                >

            </div>


            <div class="field">

                <label>Address</label>

                <textarea
                    id="address"
                    rows="3"
                    placeholder="Staff address"
                ></textarea>

            </div>


            <div class="field">

                <label>Joining Date</label>

                <input
                    type="date"
                    id="joiningDate"
                >

            </div>


            <div class="field">

                <label>Staff Role *</label>

                <select id="role" required>

                    <option value="">
                        Select Role
                    </option>

                    <option value="Event Production">
                        Event Production
                    </option>

                    <option value="Front Stage">
                        Front Stage
                    </option>

                    <option value="Back Stage">
                        Back Stage
                    </option>

                    <option value="CO2 Team">
                        CO₂ Team
                    </option>

                    <option value="Pyro Team">
                        Pyro Team
                    </option>

                    <option value="Driver">
                        Driver
                    </option>

                    <option value="Technician">
                        Technician
                    </option>

                    <option value="Event Coordinator">
                        Event Coordinator
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="field">

                <label>Staff Password *</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create login password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                id="submitButton"
            >
                ➕ Create Staff Account
            </button>


            <div id="message"></div>


        </form>

    </div>

</main>


</body>
<script>
document.getElementById("staffForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    button.disabled = true;
    button.textContent = "Creating Staff...";

    const staffData = {
        full_name: document.getElementById("fullName").value.trim(),
        mobile: document.getElementById("mobile").value.trim(),
        whatsapp: document.getElementById("whatsapp").value.trim(),
        email: document.getElementById("email").value.trim(),
        address: document.getElementById("address").value.trim(),
        joining_date: document.getElementById("joiningDate").value,
        role: document.getElementById("role").value.trim(),
        password: document.getElementById("password").value
    };

    const { data, error } = await db.functions.invoke(
        "create-staff",
        {
            body: staffData
        }
    );

    if (error) {

        message.style.color = "red";
        message.textContent = "❌ " + error.message;

        button.disabled = false;
        button.textContent = "Create Staff Account";

        return;
    }

    if (data?.error) {

        message.style.color = "red";
        message.textContent = "❌ " + data.error;

        button.disabled = false;
        button.textContent = "Create Staff Account";

        return;
    }

    message.style.color = "green";

    message.innerHTML = `
        ✅ Staff Created Successfully!<br><br>
        <strong>Staff ID:</strong> ${data.staff.staff_id}<br>
        <strong>Name:</strong> ${data.staff.full_name}<br>
        <strong>Email:</strong> ${data.staff.email}<br><br>
        ⚠️ Give the Staff ID and password to the staff member securely.
    `;

    document.getElementById("staffForm").reset();

    button.disabled = false;
    button.textContent = "Create Staff Account";

});
</script>
</html>
