<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ocean Production - Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #07111f;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #d00;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🌊 Ocean Production</h1>

    <div class="subtitle">
        Admin Login
    </div>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            required
            autocomplete="email"
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
        >

        <button type="submit" id="loginButton">
            Login
        </button>

        <div id="message"></div>

    </form>

    <a href="index.html" class="back">
        ← Back to Registration
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://nepianzfbysukaoqqbxf.supabase.co";

/*
IMPORTANT:
Paste your CURRENT Supabase PUBLISHABLE key below.
Do NOT use a secret/service_role key.
*/

const SUPABASE_KEY =
    "sb_publishable_vA6sXJTvJO5QWY6BPyH79g_muuyN9_8";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Logging in...";

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    const { data, error } =
        await db.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        console.error(error);

        message.textContent =
            error.message;

        button.disabled = false;
        button.textContent = "Login";

        return;
    }


    if (data.session) {

        window.location.href =
            "dashboard.html";

    } else {

        message.textContent =
            "Login succeeded but no session was created.";

        button.disabled = false;
        button.textContent = "Login";
    }

});

</script>

</body>
</html>
