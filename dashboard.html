<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ocean Production - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        header {
            background: #07111f;
            color: white;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 21px;
        }

        #logoutButton {
            border: none;
            background: #dc3545;
            color: white;
            padding: 9px 14px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat h3 {
            margin: 0 0 8px;
            color: #666;
            font-size: 14px;
        }

        .stat strong {
            font-size: 28px;
        }

        .search-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #07111f;
            color: white;
            font-size: 13px;
        }

        td {
            font-size: 13px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #fff3cd;
            color: #664d03;
            font-weight: bold;
        }

        .message {
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            .container {
                padding: 12px;
            }

        }
    </style>
</head>

<body>

<header>

    <h1>🌊 Ocean Production — Admin Dashboard</h1>

    <button id="logoutButton">
        Logout
    </button>

</header>


<div class="container">

    <div class="stats">

        <div class="stat">
            <h3>Total Registrations</h3>
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            <h3>New Registrations</h3>
            <strong id="newCount">0</strong>
        </div>

        <div class="stat">
            <h3>Upcoming Events</h3>
            <strong id="upcomingCount">0</strong>
        </div>

    </div>


    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            placeholder="Search registration, customer, mobile, event, venue..."
        >

    </div>


    <div class="table-box">

        <table>

            <thead>

                <tr>
                 <th>Registration ID</th>
<th>Customer</th>
<th>Contact</th>
<th>Event</th>
<th>Date</th>
<th>Venue</th>
<th>Services</th>
<th>Budget</th>
<th>Status</th>
<th>Actions</th>
                </tr>

            </thead>

            <tbody id="registrationBody">

                <tr>
                    <td colspan="9" class="message">
                        Loading registrations...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://nepianzfbysukaoqqbxf.supabase.co";


/*
Paste your CURRENT Supabase Publishable key below.
Do NOT use a secret/service_role key.
*/

const SUPABASE_KEY =
    "sb_publishable_vA6sXJTvJO5QWY6BPyH79g_muuyN9_8";


const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const body =
    document.getElementById("registrationBody");

const searchInput =
    document.getElementById("searchInput");

const logoutButton =
    document.getElementById("logoutButton");


let registrations = [];


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


async function checkLogin() {

    const {
        data: { session }
    } = await db.auth.getSession();


    if (!session) {

        window.location.replace("admin.html");

        return false;
    }


    return true;

}


async function loadRegistrations() {

    const loggedIn =
        await checkLogin();


    if (!loggedIn) return;


    const {
        data,
        error
    } = await db
        .from("registrations")
        .select("*")
        .order("created_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        body.innerHTML = `
            <tr>
                <td colspan="9" class="message">
                    Failed to load registrations.
                    <br><br>
                    ${escapeHTML(error.message)}
                </td>
            </tr>
        `;

        return;
    }


    registrations = data || [];

    updateStats();

    renderRegistrations(registrations);

}


function updateStats() {

    document.getElementById("totalCount")
        .textContent = registrations.length;


    const newCount =
        registrations.filter(
            item =>
                !item.status ||
                item.status.toLowerCase() === "new"
        ).length;


    document.getElementById("newCount")
        .textContent = newCount;


    const today =
        new Date();

    today.setHours(0, 0, 0, 0);


    const upcoming =
        registrations.filter(item => {

            if (!item.event_date) return false;

            const date =
                new Date(item.event_date);

            return date >= today;

        }).length;


    document.getElementById("upcomingCount")
        .textContent = upcoming;

}


function renderRegistrations(items) {

    if (!items.length) {

        body.innerHTML = `
            <tr>
                <td colspan="9" class="message">
                    No registrations found.
                </td>
            </tr>
        `;

        return;
    }


    body.innerHTML = items.map(item => `

        <tr>

            <td>
                <strong>
                    ${escapeHTML(item.registration_id || "-")}
                </strong>
            </td>

            <td>
                ${escapeHTML(item.full_name || "-")}
            </td>

            <td>
                ${escapeHTML(item.mobile || "-")}
                <br>
                ${escapeHTML(item.email || "")}
            </td>

            <td>
                ${escapeHTML(item.event_type || "-")}
                <br>
                ${escapeHTML(item.event_time || "")}
            </td>

            <td>
                ${escapeHTML(item.event_date || "-")}
            </td>

            <td>
                ${escapeHTML(item.venue || "-")}
                <br>
                ${escapeHTML(item.city || "")}
            </td>

            <td>
                ${escapeHTML(item.services || "-")}
            </td>

            <td>
                ${escapeHTML(item.budget || "-")}
            </td>

           <td>
    <select onchange="updateStatus('${item.id}', this.value)">
        <option value="New" ${item.status === "New" ? "selected" : ""}>New</option>
        <option value="Confirmed" ${item.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
        <option value="Completed" ${item.status === "Completed" ? "selected" : ""}>Completed</option>
        <option value="Cancelled" ${item.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
    </select>
</td>
<td>
   <button type="button" onclick="showDetails('${item.id}')">
    Details
</button><button
    type="button"
    onclick="printRegistration('${item.id}')"
>
    🖨️ Print
</button>
<button
    type="button"
    onclick="openWhatsApp('${item.whatsapp || item.mobile}')"
>
    📱 WhatsApp
</button>
<button
    type="button"
    onclick="callCustomer('${item.mobile}')"
>
    📞 Call
</button>
<button
    type="button"
    onclick="deleteRegistration('${item.id}')"
>
    🗑️ Delete
</button></td>
        </tr>

    `).join("");

}


searchInput.addEventListener(
    "input",
    function() {

        const query =
            this.value.toLowerCase().trim();


        if (!query) {

            renderRegistrations(registrations);

            return;
        }


        const filtered =
            registrations.filter(item => {

                const text = [

                    item.registration_id,
                    item.full_name,
                    item.mobile,
                    item.whatsapp,
                    item.email,
                    item.event_type,
                    item.event_date,
                    item.venue,
                    item.city,
                    item.services,
                    item.budget,
                    item.status

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return text.includes(query);

            });


        renderRegistrations(filtered);

    }
);


logoutButton.addEventListener(
    "click",
    async function() {

        await db.auth.signOut();

        window.location.replace("admin.html");

    }
);


loadRegistrations();
async function showDetails(id) {

    const { data, error } = await db
        .from("registrations")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {
        alert("Could not load registration details:\n" + error.message);
        return;
    }

    alert(
        "Registration ID: " + (data.registration_id || "-") +
        "\n\nName: " + (data.full_name || "-") +
        "\nMobile: " + (data.mobile || "-") +
        "\nWhatsApp: " + (data.whatsapp || "-") +
        "\nEmail: " + (data.email || "-") +
        "\n\nEvent: " + (data.event_type || "-") +
        "\nDate: " + (data.event_date || "-") +
        "\nTime: " + (data.event_time || "-") +
        "\nVenue: " + (data.venue || "-") +
        "\nCity: " + (data.city || "-") +
        "\nGuests: " + (data.guests || "-") +
        "\n\nServices: " + (data.services || "-") +
        "\nBudget: " + (data.budget || "-") +
        "\nRequirements: " + (data.requirements || "-") +
        "\nStatus: " + (data.status || "New")
    );
}
async function updateStatus(id, newStatus) {

    const { error } = await db
        .from("registrations")
        .update({ status: newStatus })
        .eq("id", id);

    if (error) {
        alert("Could not update status:\n" + error.message);
        return;
    }

    alert("Status updated to: " + newStatus);

    loadRegistrations();
}
function openWhatsApp(number) {

    if (!number) {
        alert("WhatsApp number is not available.");
        return;
    }

    let cleanNumber = number.replace(/\D/g, "");

    if (cleanNumber.length === 10) {
        cleanNumber = "91" + cleanNumber;
    }

    window.open(
        "https://wa.me/" + cleanNumber,
        "_blank"
    );
}
function callCustomer(number) {

    if (!number) {
        alert("Customer mobile number is not available.");
        return;
    }

    let cleanNumber = number.replace(/\D/g, "");

    if (cleanNumber.length === 10) {
        cleanNumber = "91" + cleanNumber;
    }

    window.open("tel:+" + cleanNumber);
}
async function printRegistration(id) {

    const { data, error } = await db
        .from("registrations")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {
        alert("Could not load registration:\n" + error.message);
        return;
    }

    const receipt = `
        <html>
        <head>
            <title>Ocean Production - Registration</title>
            <style>
                body {
                    font-family: Arial, sans-serif;
                    padding: 30px;
                    max-width: 700px;
                    margin: auto;
                }

                h1 {
                    text-align: center;
                }

                .box {
                    border: 1px solid #333;
                    padding: 20px;
                    margin-top: 20px;
                }

                p {
                    margin: 8px 0;
                }
            </style>
        </head>

        <body>

            <h1>OCEAN PRODUCTION</h1>
            <p style="text-align:center;">Event Registration</p>

            <div class="box">

                <p><strong>Registration ID:</strong> ${data.registration_id || "-"}</p>

                <hr>

                <p><strong>Name:</strong> ${data.full_name || "-"}</p>
                <p><strong>Mobile:</strong> ${data.mobile || "-"}</p>
                <p><strong>WhatsApp:</strong> ${data.whatsapp || "-"}</p>
                <p><strong>Email:</strong> ${data.email || "-"}</p>

                <hr>

                <p><strong>Event:</strong> ${data.event_type || "-"}</p>
                <p><strong>Date:</strong> ${data.event_date || "-"}</p>
                <p><strong>Time:</strong> ${data.event_time || "-"}</p>
                <p><strong>Venue:</strong> ${data.venue || "-"}</p>
                <p><strong>City:</strong> ${data.city || "-"}</p>
                <p><strong>Guests:</strong> ${data.guests || "-"}</p>

                <hr>

                <p><strong>Services:</strong> ${data.services || "-"}</p>
                <p><strong>Budget:</strong> ${data.budget || "-"}</p>
                <p><strong>Requirements:</strong> ${data.requirements || "-"}</p>
                <p><strong>Status:</strong> ${data.status || "New"}</p>

            </div>

            <script>
                window.onload = function() {
                    window.print();
                };
          <\/script>

        </body>
        </html>
    `;

    const printWindow = window.open("", "_blank");

    if (!printWindow) {
        alert("Please allow pop-ups for this website.");
        return;
    }

    printWindow.document.write(receipt);
    printWindow.document.close();
}
async function deleteRegistration(id) {

    const confirmed = confirm(
        "Are you sure you want to delete this registration?"
    );

    if (!confirmed) {
        return;
    }

    const { error } = await db
        .from("registrations")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Could not delete registration:\n" + error.message);
        return;
    }

    alert("Registration deleted successfully.");

    loadRegistrations();
}
</script>

</body>
</html>
