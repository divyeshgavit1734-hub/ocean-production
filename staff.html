<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ocean Production - Staff Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #0b1220;
        }

        .login-box {

            width: 90%;

            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {

            text-align: center;

            margin-bottom: 5px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        button {

            width: 100%;

            padding: 14px;

            margin-top: 22px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:active {

            transform: scale(0.98);
        }

        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }

        #message {

            margin-top: 15px;

            text-align: center;

            font-weight: bold;

            min-height: 22px;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>🌊 Ocean Production</h1>

        <div class="subtitle">
            Staff Login
        </div>


        <form id="staffLoginForm">

            <label for="email">
                Staff Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter staff email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                id="loginButton"
            >
                🔐 Staff Login
            </button>

        </form>


        <div id="message"></div>

    </div>



    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://nepianzfbysukaoqqbxf.supabase.co";


        /*
        IMPORTANT:
        Put your existing Supabase PUBLISHABLE key here.

        Do NOT use:
        - service_role key
        - secret key
        */

        const SUPABASE_KEY =
            "sb_publishable_vA6sXJTvJO5QWY6BPyH79g_muuyN9_8";


        const db =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const form =
            document.getElementById(
                "staffLoginForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!email || !password) {

                    message.textContent =
                        "❌ Enter email and password.";

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";

                message.textContent = "";


                try {

                    const {
                        data,
                        error
                    } =
                        await db.auth.signInWithPassword({

                            email: email,

                            password: password

                        });


                    if (error) {

                        message.textContent =
                            "❌ Login failed: " +
                            error.message;

                        loginButton.disabled = false;

                        loginButton.textContent =
                            "🔐 Staff Login";

                        return;
                    }


                    if (!data.session) {

                        message.textContent =
                            "❌ Login session was not created.";

                        loginButton.disabled = false;

                        loginButton.textContent =
                            "🔐 Staff Login";

                        return;
                    }


                    message.textContent =
                        "✅ Login successful!";


                    /*
                    Staff registration page
                    will be created next.
                    */

                    setTimeout(function() {

                        window.location.href =
                            "staff-registration.html";

                    }, 500);


                } catch (error) {

                    message.textContent =
                        "❌ Something went wrong: " +
                        error.message;

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "🔐 Staff Login";
                }

            }
        );

    </script>


</body>

</html>
